<!doctype html>
<title>Bike Saddle Height Calculator</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f4f4f6;
  --surface: #ffffff;
  --surface2: #f0f0f2;
  --border: #d0d0d8;
  --text: #1a1a2e;
  --text2: #555566;
  --accent: #e06028;
  --femur: #3b72d4;
  --tibia: #28a870;
  --crank: #888899;
  --target-fill: rgba(40,168,112,0.15);
  --grid: #e0e0e8;
  --warn: #c02020;
  --good: #1e8c50;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #1a1d2a;
    --surface2: #232638;
    --border: #363a52;
    --text: #e8e8f0;
    --text2: #8888aa;
    --accent: #fb923c;
    --femur: #60a5fa;
    --tibia: #34d399;
    --crank: #9999bb;
    --target-fill: rgba(52,211,153,0.12);
    --grid: #2a2e42;
    --warn: #f87171;
    --good: #34d399;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, sans-serif;
  padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
           env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
}
header h1 { font-size: 1.1rem; font-weight: 700; }
header p  { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }

main {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 16px;
  padding: 16px;
  max-width: 1300px;
  margin: 0 auto;
  align-items: start;
}

/* ── Inputs ── */
#inputs-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#panel-toolbar {
  display: flex;
  gap: 8px;
}
.tool-btn {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-size: 0.78rem;
  padding: 5px 0;
  cursor: pointer;
}
.tool-btn:hover { background: var(--border); }
#profile-bar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
#profile-bar .profile-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 6px;
}
#profile-bar .profile-row.load-row {
  grid-template-columns: 1fr auto;
}
#profile-bar select,
#profile-bar input[type="text"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 0.8rem;
  padding: 4px 6px;
  width: 100%;
  min-width: 0;
}
#profile-bar .pbtn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 0.78rem;
  padding: 4px 9px;
  cursor: pointer;
  white-space: nowrap;
}
#profile-bar .pbtn:hover { background: var(--border); }
#profile-bar .pbtn.danger { color: var(--warn); border-color: var(--warn); }
#profile-bar .pbtn.danger:hover { background: color-mix(in srgb, var(--warn) 12%, var(--surface2)); }
.input-section { display: flex; flex-direction: column; gap: 10px; }
.input-section h2 {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}

/* Body section: column headers R / L with lock */
.body-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}
.body-section-header h2 { border: none; padding: 0; }
.body-col-labels {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: .04em;
}
#btn-lock {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  padding: 2px 5px;
  font-size: 0.85rem;
  color: var(--text2);
  line-height: 1;
}
#btn-lock:hover { background: var(--surface2); }
#btn-lock.locked { color: var(--accent); border-color: var(--accent); }

/* Input group */
.input-group label {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 3px;
}
.input-group label em { font-style: normal; color: var(--text2); font-weight: 400; }

/* Single-value input (bike params) */
.dual-input {
  display: grid;
  grid-template-columns: 1fr 64px;
  gap: 8px;
  align-items: center;
}

/* Two-column input (body params: R + L) */
.dual-col-input {
  display: grid;
  grid-template-columns: 1fr 56px 56px;
  gap: 6px;
  align-items: center;
}
.dual-col-input input[type="range"] { grid-column: 1; }
.col-label {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text2);
  text-align: center;
  margin-bottom: 2px;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}
input[type="number"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 0.8rem;
  padding: 3px 6px;
  text-align: right;
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { opacity: 0.4; }
input[type="number"].differs {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--surface2));
}

/* ── Output panel ── */
#output-panel { display: flex; flex-direction: column; gap: 12px; }

/* Two diagrams side by side */
#diagrams-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.diagram-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.diag-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 6px 10px 0;
  color: var(--text2);
}
.diag-canvas {
  display: block;
  width: 100%;
  aspect-ratio: 3/4;
}

/* ── Controls ── */
#controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
}
#btn-play {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 5px;
  padding: 5px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
#btn-play:hover { filter: brightness(1.1); }
#scrubber { flex: 1; accent-color: var(--accent); }
#crank-label {
  font-size: 0.78rem;
  color: var(--text2);
  min-width: 36px;
  text-align: right;
  flex-shrink: 0;
}

/* ── Metrics ── */
#metrics-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr) repeat(3, 1fr);
  gap: 8px;
}
.metrics-group {
  display: contents;
}
.metric {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
}
.metric .mlabel { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); margin-bottom: 3px; }
.metric .mval   { font-size: 1.2rem; font-weight: 700; line-height: 1; }
.metric .munit  { font-size: 0.72rem; color: var(--text2); }
.metric.good .mval   { color: var(--good); }
.metric.warn-hi .mval { color: var(--warn); }
.metrics-side-label {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text2);
  display: flex;
  align-items: center;
  padding-left: 2px;
  grid-column: span 2;
}

#warn-banner {
  background: color-mix(in srgb, var(--warn) 15%, var(--surface));
  border: 1px solid var(--warn);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 0.8rem;
  color: var(--warn);
  display: none;
}
#warn-banner.visible { display: block; }

/* ── Chart ── */
.chart-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  height: 260px;
}
#chart-canvas { width: 100% !important; height: 100% !important; }

/* ── Responsive ── */
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  #diagrams-row { grid-template-columns: 1fr; }
  #metrics-row { grid-template-columns: repeat(3, 1fr); }
  .metrics-side-label { display: none; }
}
</style>

<header>
  <h1>Bike Saddle Height Calculator</h1>
  <p>Internal knee angle through the full crank rotation</p>
</header>

<main>
  <aside id="inputs-panel">
    <div id="panel-toolbar">
      <button class="tool-btn" id="btn-save">&#8659; Save</button>
      <button class="tool-btn" id="btn-load">&#8657; Load</button>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
  </aside>

  <section id="output-panel">
    <div id="diagrams-row">
      <div class="diagram-wrapper">
        <div class="diag-label">Right leg</div>
        <canvas class="diag-canvas" id="canvas-right"></canvas>
      </div>
      <div class="diagram-wrapper">
        <div class="diag-label">Left leg</div>
        <canvas class="diag-canvas" id="canvas-left"></canvas>
      </div>
    </div>

    <div id="controls-row">
      <button id="btn-play">&#9654; Play</button>
      <input type="range" id="scrubber" min="0" max="359" step="1" value="0">
      <span id="crank-label">0°</span>
    </div>

    <div id="metrics-row">
      <div class="metrics-side-label" style="grid-column:1/4">Right</div>
      <div class="metrics-side-label" style="grid-column:4/7">Left</div>
      <div class="metric" id="m-r-bdc"><span class="mlabel">At BDC</span><span class="mval">—</span><span class="munit">°</span></div>
      <div class="metric" id="m-r-min"><span class="mlabel">Max ext.</span><span class="mval">—</span><span class="munit">°</span></div>
      <div class="metric" id="m-r-max"><span class="mlabel">Max flex.</span><span class="mval">—</span><span class="munit">°</span></div>
      <div class="metric" id="m-l-bdc"><span class="mlabel">At BDC</span><span class="mval">—</span><span class="munit">°</span></div>
      <div class="metric" id="m-l-min"><span class="mlabel">Max ext.</span><span class="mval">—</span><span class="munit">°</span></div>
      <div class="metric" id="m-l-max"><span class="mlabel">Max flex.</span><span class="mval">—</span><span class="munit">°</span></div>
    </div>

    <div id="warn-banner"></div>

    <div class="chart-wrapper">
      <canvas id="chart-canvas"></canvas>
    </div>
  </section>
</main>

<script>
const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;
const dist  = (a,b) => Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);
const getCssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ── Parameter definitions ──────────────────────────────────────────────────
// body params have side:'both' — they get R and L copies in params
const BIKE_DEFS = [
  { key:'saddle_height',   label:'Saddle Height',   unit:'mm', min:400,  max:850,  step:5,   def:680   },
  { key:'crank_length',    label:'Crank Length',    unit:'mm', min:155,  max:185,  step:2.5, def:172.5 },
  { key:'seat_tube_angle', label:'Seat Tube Angle', unit:'°',  min:68,   max:80,   step:0.5, def:73    },
  { key:'saddle_offset',   label:'Saddle Fore/Aft', unit:'mm', min:-100, max:100,  step:5,   def:0     },
];
const BODY_DEFS = [
  { key:'upper_leg',       label:'Femur (hip–knee)',       unit:'mm', min:300, max:600, step:5,  def:420 },
  { key:'lower_leg',       label:'Tibia (knee–ankle)',     unit:'mm', min:280, max:550, step:5,  def:410 },
  { key:'foot_length',     label:'Foot Length',            unit:'mm', min:200, max:320, step:5,  def:265 },
  { key:'cleat_from_heel', label:'Cleat from Heel',        unit:'mm', min:140, max:260, step:5,  def:190 },
  { key:'ankle_angle',     label:'Ankle Angle (plantar+)', unit:'°',  min:-20, max:30,  step:1,  def:10  },
  { key:'ankle_height',   label:'Ankle Height (sole→joint)', unit:'mm', min:50, max:120, step:5,  def:75  },
];

// params flat object — body params stored as key_R and key_L
const params = {};
BIKE_DEFS.forEach(d => { params[d.key] = d.def; });
BODY_DEFS.forEach(d => { params[d.key+'_R'] = d.def; params[d.key+'_L'] = d.def; });

let legsLocked = true;

// ── Build input panel ──────────────────────────────────────────────────────
function buildInputPanel() {
  const panel = document.getElementById('inputs-panel');

  // Bike section
  const bikeSec = document.createElement('div');
  bikeSec.className = 'input-section';
  bikeSec.innerHTML = '<h2>Bike</h2>';
  panel.appendChild(bikeSec);
  BIKE_DEFS.forEach(d => {
    const grp = document.createElement('div');
    grp.className = 'input-group';
    grp.innerHTML = `
      <label>${d.label} <em>${d.unit}</em></label>
      <div class="dual-input">
        <input type="range"  id="rng-${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}">
        <input type="number" id="num-${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}">
      </div>`;
    bikeSec.appendChild(grp);
    bindBikeInput(d);
  });

  // Body section header with R / L labels + lock button
  const bodySec = document.createElement('div');
  bodySec.className = 'input-section';
  const bodyHdr = document.createElement('div');
  bodyHdr.className = 'body-section-header';
  bodyHdr.innerHTML = `
    <h2>Body</h2>
    <div class="body-col-labels">
      <span style="min-width:48px;text-align:center">R</span>
      <button id="btn-lock" class="locked" title="Lock R=L">&#128274;</button>
      <span style="min-width:48px;text-align:center">L</span>
    </div>`;
  bodySec.appendChild(bodyHdr);
  panel.appendChild(bodySec);

  BODY_DEFS.forEach(d => {
    const grp = document.createElement('div');
    grp.className = 'input-group';
    grp.innerHTML = `
      <label>${d.label} <em>${d.unit}</em></label>
      <div class="dual-col-input">
        <input type="range"  id="rng-${d.key}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}">
        <input type="number" id="num-${d.key}_R" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}">
        <input type="number" id="num-${d.key}_L" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.def}">
      </div>`;
    bodySec.appendChild(grp);
    bindBodyInput(d);
  });

  document.getElementById('btn-lock').addEventListener('click', toggleLock);
}

function bindBikeInput(d) {
  const rng = document.getElementById(`rng-${d.key}`);
  const num = document.getElementById(`num-${d.key}`);
  rng.addEventListener('input', () => {
    const v = parseFloat(rng.value);
    num.value = v;
    params[d.key] = v;
    recompute();
  });
  num.addEventListener('change', () => {
    const v = clamp(parseFloat(num.value)||d.def, d.min, d.max);
    num.value = rng.value = v;
    params[d.key] = v;
    recompute();
  });
}

function bindBodyInput(d) {
  const rng  = document.getElementById(`rng-${d.key}`);
  const numR = document.getElementById(`num-${d.key}_R`);
  const numL = document.getElementById(`num-${d.key}_L`);

  // Slider drives both when locked, R only when unlocked
  rng.addEventListener('input', () => {
    const v = parseFloat(rng.value);
    numR.value = v;
    params[d.key+'_R'] = v;
    if (legsLocked) { numL.value = v; params[d.key+'_L'] = v; }
    updateBodyInputStyles(d);
    recompute();
  });

  numR.addEventListener('change', () => {
    const v = clamp(parseFloat(numR.value)||d.def, d.min, d.max);
    numR.value = v;
    params[d.key+'_R'] = v;
    if (legsLocked) { numL.value = v; params[d.key+'_L'] = v; rng.value = v; }
    updateBodyInputStyles(d);
    recompute();
  });

  numL.addEventListener('change', () => {
    const v = clamp(parseFloat(numL.value)||d.def, d.min, d.max);
    numL.value = v;
    params[d.key+'_L'] = v;
    if (legsLocked) { numR.value = v; params[d.key+'_R'] = v; rng.value = v; }
    updateBodyInputStyles(d);
    recompute();
  });
}

function updateBodyInputStyles(d) {
  const numR = document.getElementById(`num-${d.key}_R`);
  const numL = document.getElementById(`num-${d.key}_L`);
  const rng  = document.getElementById(`rng-${d.key}`);
  const differs = params[d.key+'_R'] !== params[d.key+'_L'];
  numR.classList.toggle('differs', differs);
  numL.classList.toggle('differs', differs);
  // Slider shows R value
  rng.value = params[d.key+'_R'];
}

function toggleLock() {
  legsLocked = !legsLocked;
  const btn = document.getElementById('btn-lock');
  btn.classList.toggle('locked', legsLocked);
  btn.textContent = legsLocked ? '🔒' : '🔓';
  if (legsLocked) {
    // Sync L to R
    BODY_DEFS.forEach(d => {
      params[d.key+'_L'] = params[d.key+'_R'];
      document.getElementById(`num-${d.key}_L`).value = params[d.key+'_R'];
      updateBodyInputStyles(d);
    });
    recompute();
  }
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ── Geometry ───────────────────────────────────────────────────────────────
function seatTubeTop() {
  const a = toRad(params.seat_tube_angle);
  return {
    x: -params.saddle_height * Math.cos(a),
    y:  params.saddle_height * Math.sin(a)
  };
}

function hipPos() {
  const top = seatTubeTop();
  return { x: top.x + params.saddle_offset, y: top.y };
}

// Geometry is always computed in right-side-view convention.
// Left leg uses (theta+180) for crank angle and the canvas is X-mirrored.
function pedalPos(theta) {
  const a = toRad(theta);
  return { x: -params.crank_length * Math.sin(a), y: -params.crank_length * Math.cos(a) };
}

function anklePos(pedal, side) {
  const along = params[`cleat_from_heel_${side}`] - 0.22 * params[`foot_length_${side}`];
  const ah    = params[`ankle_height_${side}`];
  const aa    = toRad(params[`ankle_angle_${side}`]);
  // foot_dir = (cos aa, -sin aa) heel→toe; foot_normal = (sin aa, cos aa) sole→top
  return {
    x: pedal.x - along * Math.cos(aa) + ah * Math.sin(aa),
    y: pedal.y + along * Math.sin(aa) + ah * Math.cos(aa),
  };
}

function computeKnee(hip, ankle, side) {
  const U = params[`upper_leg_${side}`];
  const L = params[`lower_leg_${side}`];
  const d = dist(hip, ankle);

  if (d > U + L) return { valid: false, reason: 'overstretched', d };
  if (d < Math.abs(U - L)) return { valid: false, reason: 'compressed', d };

  const cosK = Math.max(-1, Math.min(1, (U*U + L*L - d*d) / (2*U*L)));
  const internalAngle = toDeg(Math.acos(cosK));

  const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
  const ux = dx/d, uy = dy/d;
  const along = (U*U + d*d - L*L) / (2*d);
  const h = Math.sqrt(Math.max(0, U*U - along*along));
  const knee = {
    x: hip.x + along*ux - h*uy,
    y: hip.y + along*uy + h*ux
  };

  return { valid: true, internalAngle, knee };
}

function buildCurve(side) {
  const hip = hipPos();
  return Array.from({length: 361}, (_, i) => {
    // Left crank is 180° ahead — same angle gives opposite arm position
    const pedal = pedalPos(side === 'L' ? i + 180 : i);
    const ankle = anklePos(pedal, side);
    const result = computeKnee(hip, ankle, side);
    return { angle: i, ...result };
  });
}

function extractMetrics(curve, bdcIndex = 0) {
  const valid = curve.filter(p => p.valid);
  if (!valid.length) return { bdc: null, min: null, max: null, anyOverextended: false, anyInvalid: true };
  const bdc  = curve[bdcIndex];
  const minP = valid.reduce((a,b) => a.internalAngle < b.internalAngle ? a : b);
  const maxP = valid.reduce((a,b) => a.internalAngle > b.internalAngle ? a : b);
  return {
    bdc: bdc?.valid ? bdc.internalAngle : null,
    min: minP.internalAngle,
    max: maxP.internalAngle,
    anyOverextended: valid.some(p => p.internalAngle > 148),
    anyInvalid: curve.some(p => !p.valid)
  };
}

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  crankAngle: 0,
  isPlaying: false,
  lastTimestamp: null,
  animId: null,
  speedDeg: 360,
  curveR: [], curveL: [],
  metricsR: {}, metricsL: {}
};

// ── Diagram canvas renderer ────────────────────────────────────────────────
function resizeCanvas(canvas) {
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
}

function computeGeomBounds(side) {
  const hip   = hipPos();
  const sttop = seatTubeTop();
  const pts   = [hip, sttop, {x:0,y:0},
    { x: sttop.x - 30, y: sttop.y },  // saddle rail extents
    { x: sttop.x + 30 + params.saddle_offset, y: sttop.y }];
  const aa  = toRad(params[`ankle_angle_${side}`]);
  const cfh = params[`cleat_from_heel_${side}`];
  const rem = params[`foot_length_${side}`] - cfh;
  for (let t = 0; t < 360; t += 10) {
    const p = pedalPos(side === 'L' ? t + 180 : t);
    pts.push(p, anklePos(p, side));
    pts.push({ x: p.x - cfh * Math.cos(aa), y: p.y + cfh * Math.sin(aa) });
    pts.push({ x: p.x + rem * Math.cos(aa), y: p.y - rem * Math.sin(aa) });
  }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
}

function renderSide(canvas, side, crankAngle) {
  resizeCanvas(canvas);
  const ctx  = canvas.getContext('2d');
  const dpr  = window.devicePixelRatio || 1;
  const W    = canvas.width  / dpr;
  const H    = canvas.height / dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const PAD = 28;
  const b   = computeGeomBounds(side);
  const gW  = b.maxX - b.minX, gH = b.maxY - b.minY;
  const sc  = Math.min((W - PAD*2) / gW, (H - PAD*2) / gH);
  const wcX = (b.minX + b.maxX) / 2;
  const wcY = (b.minY + b.maxY) / 2;
  const ox  = W/2 - wcX * sc;
  const oy  = H/2 + wcY * sc;

  const ws = p => ({ x: ox + p.x * sc, y: oy - p.y * sc });
  const lw = px => px / sc;

  const sttop = seatTubeTop();
  const hip   = hipPos();
  const pedal = pedalPos(side === 'L' ? crankAngle + 180 : crankAngle);
  const ankle = anklePos(pedal, side);
  const result= computeKnee(hip, ankle, side);

  const aa   = toRad(params[`ankle_angle_${side}`]);
  const cfh  = params[`cleat_from_heel_${side}`];
  const rem  = params[`foot_length_${side}`] - cfh;
  const heel = { x: pedal.x - cfh * Math.cos(aa), y: pedal.y + cfh * Math.sin(aa) };
  const toe  = { x: pedal.x + rem * Math.cos(aa), y: pedal.y - rem * Math.sin(aa) };
  // foot-sole point directly below ankle joint (along foot axis from pedal by along_dist)
  const along = params[`cleat_from_heel_${side}`] - 0.22 * params[`foot_length_${side}`];
  const soleUnderAnkle = {
    x: pedal.x - along * Math.cos(aa),
    y: pedal.y + along * Math.sin(aa),
  };

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(sc, -sc);

  // Crank circle
  ctx.beginPath(); ctx.arc(0,0,params.crank_length,0,2*Math.PI);
  ctx.setLineDash([5/sc,4/sc]); ctx.strokeStyle=getCssVar('--crank'); ctx.lineWidth=lw(1); ctx.stroke(); ctx.setLineDash([]);

  // Seat tube (fixed — BB to seat tube top, unaffected by fore/aft offset)
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(sttop.x,sttop.y);
  ctx.strokeStyle=getCssVar('--border'); ctx.lineWidth=lw(2); ctx.stroke();

  // Seat post extension to saddle position (thin line from tube top to hip)
  if (params.saddle_offset !== 0) {
    ctx.beginPath(); ctx.moveTo(sttop.x,sttop.y); ctx.lineTo(hip.x,hip.y);
    ctx.setLineDash([4/sc,3/sc]); ctx.strokeStyle=getCssVar('--border'); ctx.lineWidth=lw(1.5); ctx.stroke(); ctx.setLineDash([]);
  }

  // Saddle rail (horizontal bar centred on hip position)
  const saddleW = 60;
  ctx.beginPath(); ctx.moveTo(hip.x - saddleW/2, hip.y); ctx.lineTo(hip.x + saddleW/2, hip.y);
  ctx.strokeStyle=getCssVar('--text2'); ctx.lineWidth=lw(5); ctx.lineCap='round'; ctx.stroke();

  // Crank arm
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(pedal.x,pedal.y);
  ctx.strokeStyle=getCssVar('--crank'); ctx.lineWidth=lw(5); ctx.lineCap='round'; ctx.stroke();

  // Foot
  ctx.beginPath(); ctx.moveTo(heel.x,heel.y); ctx.lineTo(toe.x,toe.y);
  ctx.strokeStyle=getCssVar('--text2'); ctx.lineWidth=lw(4); ctx.lineCap='round'; ctx.stroke();

  // Ankle height indicator: dashed line from sole up to ankle joint
  ctx.beginPath(); ctx.moveTo(soleUnderAnkle.x,soleUnderAnkle.y); ctx.lineTo(ankle.x,ankle.y);
  ctx.setLineDash([4/sc,3/sc]); ctx.strokeStyle=getCssVar('--tibia'); ctx.lineWidth=lw(2); ctx.stroke();
  ctx.setLineDash([]);
  // tick mark at sole end — along foot_dir (cos aa, -sin aa), perpendicular to the height line
  const tickLen = lw(5);
  ctx.beginPath();
  ctx.moveTo(soleUnderAnkle.x - tickLen*Math.cos(aa), soleUnderAnkle.y + tickLen*Math.sin(aa));
  ctx.lineTo(soleUnderAnkle.x + tickLen*Math.cos(aa), soleUnderAnkle.y - tickLen*Math.sin(aa));
  ctx.strokeStyle=getCssVar('--tibia'); ctx.lineWidth=lw(1.5); ctx.stroke();

  if (result.valid) {
    const knee = result.knee;
    // Tibia
    ctx.beginPath(); ctx.moveTo(ankle.x,ankle.y); ctx.lineTo(knee.x,knee.y);
    ctx.strokeStyle=getCssVar('--tibia'); ctx.lineWidth=lw(8); ctx.lineCap='round'; ctx.stroke();
    // Femur
    ctx.beginPath(); ctx.moveTo(knee.x,knee.y); ctx.lineTo(hip.x,hip.y);
    ctx.strokeStyle=getCssVar('--femur'); ctx.lineWidth=lw(8); ctx.lineCap='round'; ctx.stroke();
    // Joints
    [[hip,12,getCssVar('--femur')],[knee,10,getCssVar('--accent')],[ankle,8,getCssVar('--tibia')]].forEach(([pt,r,c])=>{
      ctx.beginPath(); ctx.arc(pt.x,pt.y,lw(r),0,2*Math.PI); ctx.fillStyle=c; ctx.fill();
    });
  } else {
    ctx.setLineDash([8/sc,5/sc]); ctx.strokeStyle=getCssVar('--warn'); ctx.lineWidth=lw(6);
    ctx.beginPath(); ctx.moveTo(ankle.x,ankle.y); ctx.lineTo(hip.x,hip.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // BB
  ctx.beginPath(); ctx.arc(0,0,lw(8),0,2*Math.PI); ctx.fillStyle=getCssVar('--text'); ctx.fill();
  // Pedal
  ctx.beginPath(); ctx.arc(pedal.x,pedal.y,lw(6),0,2*Math.PI); ctx.fillStyle=getCssVar('--crank'); ctx.fill();

  ctx.restore();

  // ── Screen-space overlay: knee angle arc + label ──
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (result.valid) {
    const knee = result.knee;
    const ks = ws(knee), hs = ws(hip), as_ = ws(ankle);
    const aH = Math.atan2(hs.y-ks.y, hs.x-ks.x);
    const aA = Math.atan2(as_.y-ks.y, as_.x-ks.x);
    const arcR = 22;
    ctx.beginPath(); ctx.arc(ks.x,ks.y,arcR,aH,aA,false);
    ctx.strokeStyle=getCssVar('--accent'); ctx.lineWidth=1.5; ctx.setLineDash([]); ctx.stroke();
    const mid = (aH+aA)/2;
    ctx.font=`bold ${Math.round(11*dpr)}px system-ui,sans-serif`;
    ctx.fillStyle = result.internalAngle > 148 ? getCssVar('--warn') : getCssVar('--accent');
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(result.internalAngle.toFixed(1)+'°', ks.x+(arcR+16)*Math.cos(mid), ks.y+(arcR+16)*Math.sin(mid));
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
}

function renderDiagrams() {
  renderSide(document.getElementById('canvas-right'), 'R', state.crankAngle);
  renderSide(document.getElementById('canvas-left'),  'L', state.crankAngle);
}

// ── Chart ──────────────────────────────────────────────────────────────────
let chart;
const currentLinePlugin = {
  id: 'currentLine',
  afterDraw(ch) {
    const x = ch.scales.x.getPixelForValue(state.crankAngle);
    const c = ch.ctx;
    c.save(); c.beginPath();
    c.moveTo(x,ch.scales.y.top); c.lineTo(x,ch.scales.y.bottom);
    c.strokeStyle=getCssVar('--accent'); c.lineWidth=1.5; c.setLineDash([4,3]); c.stroke(); c.restore();
  }
};

function initChart() {
  const ctx = document.getElementById('chart-canvas').getContext('2d');
  const gc  = getCssVar('--grid'), tc = getCssVar('--text2');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array.from({length:361},(_,i)=>i),
      datasets: [
        // target band 145–148
        { data:Array(361).fill(148), borderColor:'rgba(40,168,112,0.5)', backgroundColor:getCssVar('--target-fill'), borderWidth:1, borderDash:[4,4], pointRadius:0, fill:'+1', tension:0, label:'148° upper' },
        { data:Array(361).fill(145), borderColor:'rgba(40,168,112,0.5)', backgroundColor:'transparent', borderWidth:1, borderDash:[4,4], pointRadius:0, fill:false, tension:0, label:'145° lower' },
        // Right leg curve
        { data:[], borderColor:getCssVar('--femur'), backgroundColor:'transparent', borderWidth:2.5, pointRadius:0, tension:0.3, fill:false, label:'Right' },
        // Left leg curve (different colour)
        { data:[], borderColor:getCssVar('--accent'), backgroundColor:'transparent', borderWidth:2, pointRadius:0, tension:0.3, fill:false, borderDash:[5,3], label:'Left' },
      ]
    },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      scales: {
        x: { title:{display:true,text:'Crank Angle (°)',color:tc,font:{size:11}}, ticks:{color:tc,maxTicksLimit:8,callback:v=>[0,90,180,270,360].includes(+v)?`${v}°`:''}, grid:{color:gc} },
        y: { title:{display:true,text:'Internal Knee Angle (°)',color:tc,font:{size:11}}, ticks:{color:tc,stepSize:20}, grid:{color:gc} }
      },
      plugins: {
        legend: { display:true, position:'bottom', labels:{color:tc,font:{size:11},boxWidth:20,filter:i=>i.datasetIndex>=2} },
        tooltip: { callbacks: {
          title: items=>`Crank: ${items[0].label}°`,
          label: item => item.datasetIndex>=2 ? `${item.dataset.label}: ${parseFloat(item.formattedValue).toFixed(1)}°` : null,
          filter: item => item.datasetIndex>=2
        }}
      }
    },
    plugins: [currentLinePlugin]
  });
}

function updateChart() {
  if (!chart) return;
  chart.data.datasets[2].data = state.curveR.map(p => p.valid ? +p.internalAngle.toFixed(2) : null);
  chart.data.datasets[3].data = state.curveL.map(p => p.valid ? +p.internalAngle.toFixed(2) : null);
  chart.update('none');
}

// ── Metrics DOM ────────────────────────────────────────────────────────────
function classifyAngle(v) {
  if (v === null) return '';
  if (v >= 145 && v <= 148) return 'good';
  if (v > 148) return 'warn';
  return '';
}

function setMetric(id, val, cls) {
  const el = document.getElementById(id);
  el.querySelector('.mval').textContent = val !== null ? val.toFixed(1) : '—';
  el.classList.remove('good','warn-hi');
  if (cls === 'good') el.classList.add('good');
  if (cls === 'warn') el.classList.add('warn-hi');
}

function updateMetrics() {
  const mR = state.metricsR, mL = state.metricsL;
  setMetric('m-r-bdc', mR.bdc, classifyAngle(mR.bdc));
  setMetric('m-r-min', mR.max, mR.max>148?'warn': mR.max>=145?'good':'');  // max angle = most extended
  setMetric('m-r-max', mR.min, '');                                          // min angle = most flexed
  setMetric('m-l-bdc', mL.bdc, classifyAngle(mL.bdc));
  setMetric('m-l-min', mL.max, mL.max>148?'warn': mL.max>=145?'good':'');
  setMetric('m-l-max', mL.min, '');

  const warnings = [];
  if (mR.max > 148) warnings.push('Right leg: over-extension detected (> 148°).');
  if (mL.max > 148) warnings.push('Left leg: over-extension detected (> 148°).');
  if (mR.anyInvalid || mL.anyInvalid) warnings.push('Geometry unreachable at some crank positions — check measurements.');
  const wb = document.getElementById('warn-banner');
  if (warnings.length) { wb.textContent = warnings.join(' '); wb.classList.add('visible'); }
  else wb.classList.remove('visible');
}

// ── Recompute ──────────────────────────────────────────────────────────────
function recompute() {
  state.curveR   = buildCurve('R');
  state.curveL   = buildCurve('L');
  state.metricsR = extractMetrics(state.curveR, 0);
  state.metricsL = extractMetrics(state.curveL, 180);
  updateChart();
  updateMetrics();
  renderDiagrams();
}

// ── Animation ──────────────────────────────────────────────────────────────
const btnPlay    = document.getElementById('btn-play');
const scrubber   = document.getElementById('scrubber');
const crankLabel = document.getElementById('crank-label');

function syncScrubber() {
  scrubber.value = Math.round(state.crankAngle);
  crankLabel.textContent = Math.round(state.crankAngle) + '°';
}

function frame(ts) {
  if (!state.isPlaying) return;
  if (state.lastTimestamp !== null) {
    const dt = (ts - state.lastTimestamp) / 1000;
    state.crankAngle = (state.crankAngle + state.speedDeg * dt) % 360;
  }
  state.lastTimestamp = ts;
  syncScrubber();
  renderDiagrams();
  updateMetrics();
  chart.update('none');
  state.animId = requestAnimationFrame(frame);
}

function play()  {
  if (state.isPlaying) return;
  state.isPlaying = true; state.lastTimestamp = null;
  state.animId = requestAnimationFrame(frame);
  btnPlay.textContent = '⏸ Pause';
}
function pause() {
  state.isPlaying = false;
  if (state.animId) cancelAnimationFrame(state.animId);
  state.animId = null;
  btnPlay.textContent = '▶ Play';
}

btnPlay.addEventListener('click', () => state.isPlaying ? pause() : play());
scrubber.addEventListener('input', () => {
  pause();
  state.crankAngle = parseFloat(scrubber.value);
  crankLabel.textContent = Math.round(state.crankAngle) + '°';
  renderDiagrams(); updateMetrics(); chart.update('none');
});

// ── localStorage Profiles ─────────────────────────────────────────────────
function getAllProfiles() {
  try { return JSON.parse(localStorage.getItem('saddleProfiles') || '{}'); }
  catch { return {}; }
}

function refreshProfileSelect(selectName) {
  const sel = document.getElementById('profile-select');
  if (!sel) return;
  const names = Object.keys(getAllProfiles());
  sel.innerHTML = names.length
    ? names.map(n => `<option value="${n}"${n===selectName?' selected':''}>${n}</option>`).join('')
    : '<option value="" disabled selected>No saved profiles</option>';
}

function saveProfile(name) {
  if (!name) { alert('Enter a profile name first.'); return; }
  const profiles = getAllProfiles();
  profiles[name] = { ...params };
  localStorage.setItem('saddleProfiles', JSON.stringify(profiles));
  localStorage.setItem('saddleLastProfile', name);
  refreshProfileSelect(name);
}

function loadProfile(name) {
  const profiles = getAllProfiles();
  if (!profiles[name]) return;
  applyLoadedParams(profiles[name]);
  localStorage.setItem('saddleLastProfile', name);
  document.getElementById('profile-name').value = name;
}

function deleteProfile(name) {
  if (!name) return;
  if (!confirm(`Delete profile "${name}"?`)) return;
  const profiles = getAllProfiles();
  delete profiles[name];
  localStorage.setItem('saddleProfiles', JSON.stringify(profiles));
  if (localStorage.getItem('saddleLastProfile') === name)
    localStorage.removeItem('saddleLastProfile');
  refreshProfileSelect('');
  document.getElementById('profile-name').value = '';
}

function buildProfileBar() {
  const bar = document.createElement('div');
  bar.id = 'profile-bar';
  bar.innerHTML = `
    <div class="profile-row load-row">
      <select id="profile-select"><option value="" disabled selected>No saved profiles</option></select>
      <button class="pbtn" id="pbtn-load">Load</button>
    </div>
    <div class="profile-row">
      <input type="text" id="profile-name" placeholder="Profile name…">
      <button class="pbtn" id="pbtn-save">Save</button>
      <button class="pbtn danger" id="pbtn-delete">Delete</button>
    </div>`;
  const panel = document.getElementById('inputs-panel');
  const toolbar = document.getElementById('panel-toolbar');
  panel.insertBefore(bar, toolbar.nextSibling);

  const nameInput = document.getElementById('profile-name');
  const sel       = document.getElementById('profile-select');

  document.getElementById('pbtn-save').addEventListener('click', () => saveProfile(nameInput.value.trim()));
  document.getElementById('pbtn-load').addEventListener('click', () => loadProfile(sel.value));
  document.getElementById('pbtn-delete').addEventListener('click', () => deleteProfile(sel.value));
  sel.addEventListener('change', () => { nameInput.value = sel.value; });

  refreshProfileSelect('');
}

// ── Save / Load ────────────────────────────────────────────────────────────
function saveParams() {
  const blob = new Blob([JSON.stringify(params, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {href:url, download:'saddle-fit.json'});
  a.click(); URL.revokeObjectURL(url);
}

function applyLoadedParams(data) {
  BIKE_DEFS.forEach(d => {
    if (data[d.key] === undefined) return;
    const v = clamp(parseFloat(data[d.key]), d.min, d.max);
    params[d.key] = v;
    document.getElementById(`rng-${d.key}`).value = v;
    document.getElementById(`num-${d.key}`).value = v;
  });
  BODY_DEFS.forEach(d => {
    ['R','L'].forEach(s => {
      const k = d.key+'_'+s;
      if (data[k] === undefined) return;
      const v = clamp(parseFloat(data[k]), d.min, d.max);
      params[k] = v;
      document.getElementById(`num-${k}`).value = v;
    });
    document.getElementById(`rng-${d.key}`).value = params[d.key+'_R'];
    updateBodyInputStyles(d);
  });
  recompute();
}

function loadParams(file) {
  const reader = new FileReader();
  reader.onload = e => { try { applyLoadedParams(JSON.parse(e.target.result)); } catch { alert('Invalid file.'); } };
  reader.readAsText(file);
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildInputPanel();
  buildProfileBar();
  refreshProfileSelect('');

  // Auto-restore last profile
  const _last = localStorage.getItem('saddleLastProfile');
  if (_last && getAllProfiles()[_last]) loadProfile(_last);

  document.getElementById('btn-save').addEventListener('click', saveParams);
  const fi = document.getElementById('file-input');
  document.getElementById('btn-load').addEventListener('click', () => fi.click());
  fi.addEventListener('change', e => { if (e.target.files[0]) loadParams(e.target.files[0]); e.target.value=''; });

  initChart();
  recompute();
  syncScrubber();

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    chart.destroy(); initChart(); updateChart(); renderDiagrams();
  });

  const ro = new ResizeObserver(() => renderDiagrams());
  ro.observe(document.getElementById('canvas-right').parentElement);
  ro.observe(document.getElementById('canvas-left').parentElement);
});
</script>
